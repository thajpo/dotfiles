# Change prefix from Ctrl+B to Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Eliminate escape delay (critical for vim)
set -sg escape-time 0

# Enable mouse support
set -g mouse on

# Keep useful scrollback without unbounded writes, and integrate the system clipboard.
set -g history-limit 50000
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string '#S: #W — #{pane_current_path}'

# Keep TUIs colorful and preserve clickable OSC 8 links inside tmux.
set -s 'terminal-features[100]' 'xterm-kitty:RGB:hyperlinks'
set -g extended-keys on
set-environment -gu NO_COLOR
set-environment -gu TERM
set-environment -g COLORTERM truecolor

# Do not let exported bash functions from Environment Modules leak into new panes.
# tmux stores environment values as single lines, which corrupts multiline
# exported functions such as module/ml and makes bash complain on startup.
set-environment -gu BASH_FUNC__module_raw%%
set-environment -gu BASH_FUNC_ml%%
set-environment -gu BASH_FUNC_module%%

# Forward focus changes to terminal apps (needed for nvim FocusGained autocmds)
set -g focus-events on

# Allow terminal to handle clicks on links (OSC 8 hyperlinks)
set -g allow-passthrough on

# Use vim keys in copy mode
setw -g mode-keys vi

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Intuitive splits: | for vertical, _ for horizontal
bind | split-window -h
bind _ split-window -v

# Vim-style pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Session navigation
# Ctrl-a g returns to the global secretary grid, but never creates or targets it.
bind-key -T prefix g run-shell -b '[ -x "${PI_TMUX_BIN_DIR:-$HOME/.local/bin}/pi-tmux-switch" ] && "${PI_TMUX_BIN_DIR:-$HOME/.local/bin}/pi-tmux-switch" pisec'
bind-key -T prefix p run-shell -b '[ -x "${PI_TMUX_BIN_DIR:-$HOME/.local/bin}/pi-tmux-switch" ] && "${PI_TMUX_BIN_DIR:-$HOME/.local/bin}/pi-tmux-switch" pi-personal'
bind \\ switch-client -l       # Toggle last session
bind -r ( switch-client -p     # Previous session
bind -r ) switch-client -n     # Next session (cycle)

# Vim-style copy mode: v to select, y to yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.local/bin/tmux-copy"

# Copy to clipboard on mouse drag release
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-copy"

# Disable auto-rename so your names stick
set-option -g allow-rename off
set-option -g automatic-rename off

# Plugins. Catppuccin must precede continuum: continuum appends its save
# interpolation to the status line when TPM loads plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Catppuccin theme settings (set BEFORE loading plugin)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text '#W'
set -g @catppuccin_window_current_text '#W'

# Resurrect settings. Keep this allowlist conservative: managed Pi launchers
# carry stable session identity, so restoration reopens the existing
# conversations rather than seeding new ones. Keep unrestricted process capture off.
# Secretary panes are deliberately not process-restored: the grid is a
# controller, and restoring two panes with one project session ID creates
# competing in-memory conversations. The post-restore hook lets pisec rebuild
# one pane per project after tmux has finished restoring all windows.
set -g @resurrect-processes 'nvim vim'
if-shell '[ -n "${PI_TMUX_SOCKET:-}" ]' 'set -g @resurrect-dir "#{E:PI_SYSTEM_STATE_ROOT}/tmux/resurrect"'
# Post-restore repair runs only when the secretary grid session existed
# before the restart (or PI_AUTO_START=1 opts in); a bare server start must
# not launch every Pi agent unrequested.
set -g @resurrect-hook-post-restore-all '[ "${PI_AUTO_START:-0}" = 1 ] || tmux has-session -t =pisec 2>/dev/null; if [ $? -eq 0 ] && [ -x "${PI_TMUX_BIN_DIR:-$HOME/.local/bin}/pisec" ]; then "${PI_TMUX_BIN_DIR:-$HOME/.local/bin}/pisec" launch >/dev/null 2>&1; fi'
# Save the visible Pi UI too; the conversation itself is recovered by the
# stable --session-id/registry arguments above.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'visible'
set -g @resurrect-strategy-nvim 'session'

# Continuum settings (auto-save every 15 min, auto-restore on tmux start).
# pi-restart disables restore for that one boot because it explicitly rebuilds
# the managed layout; stable Pi session IDs still resume the conversations.
set -g @continuum-restore 'on'
if-shell '[ "${PI_RESTARTING:-0}" = 1 ]' 'set -g @continuum-restore off'
set -g @continuum-save-interval '15'

# The outer tmux surface owns location and navigation: session, window,
# directory, Git state, and active application. Pi's footer owns model/activity
# state instead of repeating this identity information. Status is defined before
# TPM so continuum (loaded last above) can prefix
# its save interpolation without a later set -g erasing it.
set -g status-right-length 200
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_gitmux}"
set -ag status-right "#{E:@catppuccin_status_application}"

# Initialize TPM last; continuum then retains its save interpolation.
run '~/.tmux/plugins/tpm/tpm'

# Give continuum its restore window, then ensure the independent personal
# workspace exists. Explicit pi-restart boots this itself and suppresses the
# asynchronous repair so restore and startup cannot create duplicate panes.
# Ensure the independent personal workspace, but only when it already exists
# or PI_AUTO_START=1 opts in: starting any tmux server must not launch every
# Pi agent unrequested.
run-shell -b 'if [ "${PI_RESTARTING:-0}" != 1 ]; then sleep 3; if [ "${PI_AUTO_START:-0}" = 1 ] || tmux has-session -t =pi-personal 2>/dev/null; then if [ -x "${PI_TMUX_BIN_DIR:-$HOME/.local/bin}/pi-personal" ]; then if [ "${PI_TMUX_LAYOUT:-}" = mobile ]; then "${PI_TMUX_BIN_DIR:-$HOME/.local/bin}/pi-personal" --ensure --mobile >/dev/null 2>&1; else "${PI_TMUX_BIN_DIR:-$HOME/.local/bin}/pi-personal" --ensure >/dev/null 2>&1; fi; fi; fi'

# Show durable Voxtype state in every tmux session. This append must not erase
# continuum's status-right interpolation.
set -g status-interval 1
set -ag status-right ' #(~/.local/bin/tmux-voxtype-status)'
