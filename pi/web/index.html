<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3efe3">
  <title>Pi Web</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23161303'/%3E%3Crect x='7' y='7' width='18' height='18' rx='3' fill='%23c3ef2a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/home">Pi Web</a>
    <nav class="rail" aria-label="Primary">
      <a href="#/home" data-nav="home">Home</a>
      <a href="#/projects" data-nav="projects">Projects</a>
      <a href="#/inbox" data-nav="inbox" data-nav-inbox="true">
        Inbox
        <span class="nav-count" id="nav-inbox-count"></span>
      </a>
    </nav>
    <p class="topbar-note" id="topbar-note">Fixture data</p>
  </header>

  <main id="main" class="main" tabindex="-1">
    <section id="list-pane" class="pane pane-list" aria-label="Current view"></section>
    <section id="detail-pane" class="pane pane-detail" aria-label="Detail" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Primary mobile">
    <a href="#/home" data-nav="home">Home</a>
    <a href="#/projects" data-nav="projects">Projects</a>
    <a href="#/inbox" data-nav="inbox">Inbox</a>
  </nav>

  <dialog id="decision-sheet" class="sheet" aria-labelledby="sheet-title" aria-describedby="sheet-desc"></dialog>

  <div id="announcer" class="visually-hidden" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
